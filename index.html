<!doctype html>
<html lang="en">
  <head>
    <!-- Anti-flash theme detection: runs synchronously before first paint -->
    <script>
      (function(){
        var stored = localStorage.getItem('ns-theme');
        var theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="North Star Support Bot — Fast, reliable customer support for North Star Outdoor Co. apparel & camping gear." />
    <title>North Star Outdoor Co. | Customer Support</title>
    <!-- Google Fonts: Outfit & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  </head>

  </body>
</html>
